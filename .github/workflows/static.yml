# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publica só o que o app usa (06/11/2026, lote 17.4). Antes ia o
      # repositório inteiro, e AGENTS.md, relatorios/, testes/ e o código da
      # ponte abriam por app.voxcharmai.com. Nada disso é segredo, mas não é
      # do site. O transcritor local e o código da ponte continuam no GitHub,
      # que é de onde o app manda baixar.
      # ARQUIVO NOVO que o app carrega (script, imagem, pasta) entra AQUI,
      # senão ele dá 404 no ar. O teste testes/site-publicado.js (no
      # "Jogador leigo") monta esta mesma pasta e falha se faltar algo.
      - name: Montar só o que o app usa
        run: bash testes/montar-site.sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
