# Ponte do Vox — configuração do Cloudflare Worker.
# Segredos (GROQ_KEY, PAINEL_SENHA, SAL_IP) NUNCA entram aqui: são colocados
# com `npx wrangler secret put NOME`, e ficam só no Cloudflare.
name = "vox-ponte"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# De onde a ponte aceita pedidos (localhost é sempre aceito, pra testes).
ORIGENS = "https://app.voxcharmai.com"

[[d1_databases]]
binding = "DB"
database_name = "vox-ponte"
# Preenchido depois do `npx wrangler d1 create vox-ponte`.
database_id = "00000000-0000-0000-0000-000000000000"
