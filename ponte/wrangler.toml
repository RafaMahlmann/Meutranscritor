# Ponte do Vox — configuração do Cloudflare Worker.
# Segredos (GROQ_KEY, SAL_IP) NUNCA entram aqui: são colocados
# com `npx wrangler secret put NOME`, e ficam só no Cloudflare.
name = "vox-ponte"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# De onde a ponte aceita pedidos (localhost é sempre aceito, pra testes).
ORIGENS = "https://app.voxcharmai.com"
# Pra onde /painel manda (o painel mora no Worker vox-painel desde 13/11/2026;
# ver wrangler.painel.toml). Endereço não é segredo: quem entra é o Access.
PAINEL_URL = "https://vox-painel.flordeplasma.workers.dev/painel"

[[d1_databases]]
binding = "DB"
database_name = "vox-ponte"
# Criado com `npx wrangler d1 create vox-ponte` (25/09/2026).
database_id = "d8db107c-3878-4d6c-85b7-bcbcb610d29e"
